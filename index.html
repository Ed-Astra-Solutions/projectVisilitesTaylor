  <script>
    // PWA install bridge.
    //
    // Chrome fires `beforeinstallprompt` once, early — usually before Flutter
    // has booted. It must be captured here and stashed, or the chance to show
    // the native install dialog is lost. The Dart side reads this object and
    // drives the UI; see lib/shared/services/pwa_install_web.dart.
    (function () {
      var deferredPrompt = null;

      window.visilitesPwa = {
        // True once Chrome has offered us an install prompt to defer.
        canInstall: function () { return deferredPrompt !== null; },

        // True when already running as an installed app, so we never nag.
        isInstalled: function () {
          return window.matchMedia('(display-mode: standalone)').matches
            || window.navigator.standalone === true;
        },

        // iOS Safari never fires beforeinstallprompt; it needs manual
        // "Share -> Add to Home Screen" instructions instead.
        isIos: function () {
          return /iphone|ipad|ipod/i.test(window.navigator.userAgent)
            && !window.MSStream;
        },

        // Shows the native dialog. Resolves 'accepted', 'dismissed',
        // or 'unavailable' if there is nothing to show.
        promptInstall: function () {
          if (!deferredPrompt) return Promise.resolve('unavailable');
          var p = deferredPrompt;
          deferredPrompt = null;
          p.prompt();
          return p.userChoice
            .then(function (choice) { return choice.outcome; })
            .catch(function () { return 'dismissed'; });
        }
      };

      window.addEventListener('beforeinstallprompt', function (e) {
        // Suppress Chrome's own mini-infobar so our in-app banner is the
        // single, branded entry point.
        e.preventDefault();
        deferredPrompt = e;
      });

      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
      });
    })();

    // WebOTP bridge — zero-tap SMS code entry on Android Chrome.
    //
    // This is a bonus layer on top of the keyboard suggestion that
    // autocomplete="one-time-code" already provides. It only fires when the
    // SMS ends with an origin-binding line:
    //
    //     @<this-origin> #<code>
    //
    // Until the DLT-registered template carries that line the call simply
    // never resolves, which is harmless — the keyboard suggestion still works.
    // Requires a secure context (HTTPS or localhost).
    (function () {
      var controller = null;

      window.visilitesOtp = {
        isSupported: function () {
          return 'OTPCredential' in window && window.isSecureContext;
        },

        // Resolves with the code, or '' if cancelled/unsupported/failed.
        listen: function () {
          if (!this.isSupported()) return Promise.resolve('');
          this.cancel();
          controller = new AbortController();
          return navigator.credentials
            .get({ otp: { transport: ['sms'] }, signal: controller.signal })
            .then(function (c) { return (c && c.code) || ''; })
            .catch(function () { return ''; });
        },

        cancel: function () {
          if (controller) { controller.abort(); controller = null; }
        }
      };
    })();
  </script>
